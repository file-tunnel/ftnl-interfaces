version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /generated/rust
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /generated/typescript
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /generated/dart
    schedule:
      interval: weekly
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
